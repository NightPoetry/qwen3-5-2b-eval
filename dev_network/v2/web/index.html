<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v2 Knowledge Network Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --border: #2a2a3a;
  --text: #e0e0e8;
  --text-dim: #808098;
  --accent: #6c8cff;
  --accent-dim: #3a4a80;
  --node-active: #4caf50;
  --node-entry: #ff9800;
  --node-error: #f44336;
  --trace-line: #2a3a5a;
}

body {
  font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

.sidebar {
  width: 280px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  flex-shrink: 0;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h2 {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.5px;
}

.sidebar-header .subtitle {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}

.node-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.node-item {
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--text-dim);
  cursor: default;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s;
}

.node-item:hover {
  background: var(--surface2);
}

.node-item.active {
  background: rgba(76, 175, 80, 0.12);
  color: var(--node-active);
}

.node-id {
  font-family: "SF Mono", "Fira Code", monospace;
  font-size: 10px;
  color: var(--accent-dim);
  min-width: 28px;
}

.node-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--border);
  flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}

.node-item.active .node-dot {
  background: var(--node-active);
  box-shadow: 0 0 6px var(--node-active);
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.msg {
  max-width: 720px;
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user {
  align-self: flex-end;
}

.msg.assistant {
  align-self: flex-start;
  width: 100%;
  max-width: 720px;
}

.msg-bubble {
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg.user .msg-bubble {
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}

.msg.assistant .msg-bubble {
  background: var(--surface2);
  color: var(--text);
  border-bottom-left-radius: 4px;
}

.msg-trace {
  margin-top: 8px;
  padding: 10px 14px;
  background: rgba(108, 140, 255, 0.06);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 11px;
  font-family: "SF Mono", "Fira Code", monospace;
}

.trace-header {
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}

.trace-header .toggle {
  font-size: 9px;
  transition: transform 0.2s;
}

.trace-header .toggle.open {
  transform: rotate(90deg);
}

.trace-body {
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.trace-body.collapsed {
  max-height: 0;
}

.trace-step {
  padding: 2px 0;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 4px;
}

.trace-step .dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--node-active);
  flex-shrink: 0;
}

.trace-step.entry .dot { background: var(--node-entry); }
.trace-step.error .dot { background: var(--node-error); }

.trace-meta {
  margin-top: 6px;
  color: var(--text-dim);
  font-size: 10px;
  display: flex;
  gap: 12px;
}

.input-area {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  max-width: 720px;
}

.input-row textarea {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  padding: 10px 14px;
  resize: none;
  min-height: 42px;
  max-height: 120px;
  outline: none;
  transition: border-color 0.2s;
}

.input-row textarea:focus {
  border-color: var(--accent);
}

.input-row textarea::placeholder {
  color: var(--text-dim);
}

.btn {
  height: 42px;
  padding: 0 18px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  flex-shrink: 0;
}

.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-send {
  background: var(--accent);
  color: #fff;
}

.btn-reset {
  background: var(--surface2);
  color: var(--text-dim);
  border: 1px solid var(--border);
  font-size: 11px;
  height: 42px;
  padding: 0 12px;
}

.status-bar {
  padding: 6px 24px;
  font-size: 11px;
  color: var(--text-dim);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 16px;
}

.thinking {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  color: var(--text-dim);
  font-size: 13px;
}

.thinking-dots {
  display: flex;
  gap: 4px;
}

.thinking-dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.4s infinite ease-in-out;
}

.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes pulse {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  text-align: center;
  gap: 16px;
  padding: 40px;
}

.welcome h1 {
  font-size: 20px;
  color: var(--text);
  font-weight: 600;
}

.welcome p {
  font-size: 13px;
  max-width: 400px;
  line-height: 1.6;
}

.welcome .examples {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 8px;
}

.welcome .example-chip {
  padding: 8px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}

.welcome .example-chip:hover {
  border-color: var(--accent);
  background: rgba(108, 140, 255, 0.08);
}

.node-list::-webkit-scrollbar,
.chat-area::-webkit-scrollbar {
  width: 4px;
}

.node-list::-webkit-scrollbar-thumb,
.chat-area::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 2px;
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>KNOWLEDGE NETWORK</h2>
    <div class="subtitle">Qwen3.5-2B + 可执行节点图</div>
    <a href="/graph" style="display:inline-block;margin-top:8px;padding:5px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--accent);font-size:11px;text-decoration:none;transition:border-color 0.2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">3D 图谱 →</a>
  </div>
  <div class="node-list" id="nodeList"></div>
</div>

<div class="main">
  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <h1>v2 可执行知识网络</h1>
      <p>你的每句话会经过节点图路由。<br>触发匹配的节点会自动执行，左侧亮灯显示激活路径。</p>
      <div class="examples">
        <div class="example-chip" onclick="sendExample(this)">我今天好开心</div>
        <div class="example-chip" onclick="sendExample(this)">你是谁呀</div>
        <div class="example-chip" onclick="sendExample(this)">我压力好大</div>
        <div class="example-chip" onclick="sendExample(this)">人生有什么意义</div>
      </div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">
    <span id="statusNodes">节点: --</span>
    <span id="statusCursor">光标: 入口</span>
    <span id="statusTurn">轮次: 0</span>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder="说点什么... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
      <button class="btn btn-send" id="sendBtn" onclick="send()">发送</button>
      <button class="btn btn-reset" onclick="resetSession()">新对话</button>
    </div>
  </div>
</div>

<script>
let sessionId = crypto.randomUUID();
let allNodes = [];
let isProcessing = false;

async function loadNodes() {
  try {
    const res = await fetch('/api/nodes');
    const data = await res.json();
    allNodes = data.nodes;
    document.getElementById('statusNodes').textContent = `节点: ${data.count}`;
    renderNodeList([]);
  } catch (e) {
    console.error('Failed to load nodes:', e);
  }
}

function renderNodeList(activeIds) {
  const list = document.getElementById('nodeList');
  list.innerHTML = allNodes.map(n => {
    const active = activeIds.includes(n.id) ? 'active' : '';
    return `<div class="node-item ${active}" data-id="${n.id}">
      <span class="node-dot"></span>
      <span class="node-id">${n.id}</span>
      <span>${n.name}</span>
    </div>`;
  }).join('');
}

function sendExample(el) {
  document.getElementById('input').value = el.textContent;
  send();
}

async function send() {
  const input = document.getElementById('input');
  const message = input.value.trim();
  if (!message || isProcessing) return;

  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  appendMessage('user', message);
  const thinkingEl = appendThinking();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: sessionId }),
    });

    const data = await res.json();
    thinkingEl.remove();

    if (data.error) {
      appendMessage('assistant', `错误: ${data.error}`);
    } else {
      appendMessage('assistant', data.response, data.trace, data.elapsed);
      highlightNodes(data.trace);
      updateStatus(data);
    }
  } catch (e) {
    thinkingEl.remove();
    appendMessage('assistant', `网络错误: ${e.message}`);
  }

  isProcessing = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

function appendMessage(role, text, trace, elapsed) {
  const area = document.getElementById('chatArea');
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;

  let html = `<div class="msg-bubble">${escapeHtml(text)}</div>`;

  if (trace && trace.length > 0) {
    const traceId = 'trace-' + Date.now();
    html += `<div class="msg-trace">
      <div class="trace-header" onclick="toggleTrace('${traceId}')">
        <span class="toggle open" id="toggle-${traceId}">&#9654;</span>
        节点轨迹 (${trace.length} 个节点激活)
      </div>
      <div class="trace-body" id="${traceId}">
        ${trace.map(t => {
          const indent = '&nbsp;&nbsp;'.repeat(t.depth);
          const cls = t.reason === 'entry' ? 'entry' : (t.error ? 'error' : '');
          const err = t.error ? ` <span style="color:var(--node-error)">[${t.error}]</span>` : '';
          return `<div class="trace-step ${cls}">${indent}<span class="dot"></span> [${t.node}] ${t.name} <span style="color:var(--text-dim);font-size:10px">${t.reason}</span>${err}</div>`;
        }).join('')}
        <div class="trace-meta">
          <span>耗时 ${elapsed}s</span>
        </div>
      </div>
    </div>`;
  }

  msg.innerHTML = html;
  area.appendChild(msg);
  area.scrollTop = area.scrollHeight;
}

function appendThinking() {
  const area = document.getElementById('chatArea');
  const el = document.createElement('div');
  el.className = 'msg assistant';
  el.innerHTML = `<div class="thinking">
    <div class="thinking-dots"><span></span><span></span><span></span></div>
    节点图执行中...
  </div>`;
  area.appendChild(el);
  area.scrollTop = area.scrollHeight;
  return el;
}

function highlightNodes(trace) {
  const activeIds = trace.map(t => t.node);
  renderNodeList(activeIds);
}

function updateStatus(data) {
  document.getElementById('statusCursor').textContent =
    `光标: ${data.cursor.length ? data.cursor.join(' → ') : '入口'}`;
  document.getElementById('statusTurn').textContent = `轮次: ${data.turn}`;
}

function toggleTrace(id) {
  const body = document.getElementById(id);
  const toggle = document.getElementById('toggle-' + id);
  body.classList.toggle('collapsed');
  toggle.classList.toggle('open');
}

async function resetSession() {
  await fetch('/api/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId }),
  });
  sessionId = crypto.randomUUID();
  document.getElementById('chatArea').innerHTML = `
    <div class="welcome" id="welcome">
      <h1>v2 可执行知识网络</h1>
      <p>你的每句话会经过节点图路由。<br>触发匹配的节点会自动执行，左侧亮灯显示激活路径。</p>
      <div class="examples">
        <div class="example-chip" onclick="sendExample(this)">我今天好开心</div>
        <div class="example-chip" onclick="sendExample(this)">你是谁呀</div>
        <div class="example-chip" onclick="sendExample(this)">我压力好大</div>
        <div class="example-chip" onclick="sendExample(this)">人生有什么意义</div>
      </div>
    </div>`;
  renderNodeList([]);
  document.getElementById('statusCursor').textContent = '光标: 入口';
  document.getElementById('statusTurn').textContent = '轮次: 0';
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

const input = document.getElementById('input');
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

loadNodes();
</script>
</body>
</html>
